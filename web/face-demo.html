<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy face demo</title>
  <!-- Throwaway check page for face.js and preview.js; removed in Task 10. -->
  <link rel="stylesheet" href="css/app.css">
  <style>
    .page { padding-top: 1.5rem; padding-bottom: 3rem; }
    h1 { font-size: 1.25rem; }
    h2 { font-size: 1rem; margin-top: 2rem; }
    .face-box { max-width: 28rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; align-items: center; }
    button, select, input { font: inherit; color: var(--fg); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.6rem; }
    button[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); }
    label { display: inline-flex; gap: 0.3rem; align-items: center; }
    input[type="text"] { width: 9rem; }
  </style>
</head>
<body>
<main class="page">
  <h1>Buddy face demo</h1>
  <div class="face-box" id="face"></div>
  <div class="row" id="moods"></div>

  <h2>Preview</h2>
  <div id="preview"></div>
  <div class="row">
    <label>Theme <select id="theme"></select></label>
    <label><input type="radio" name="mount" value="left" checked> Left</label>
    <label><input type="radio" name="mount" value="right"> Right</label>
  </div>
  <div class="row" id="pages"></div>
  <div class="row">
    <label>GitHub <input type="text" id="gh" value="IdefixRC"></label>
    <label>Stock key <input type="text" id="sk" value="demo-key"></label>
    <label>Ticker <input type="text" id="tk" value="AVGO"></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="fahr"> Fahrenheit</label>
    <label><input type="checkbox" id="mph"> mph</label>
    <label><input type="checkbox" id="live"> Live values</label>
    <label>Show page <select id="only"><option value="">cycle</option></select></label>
  </div>
</main>
<script type="module">
  import { createFace, MOODS } from "./js/face.js";
  import { createPreview } from "./js/preview.js";
  import { PAGE_KEYS } from "./js/settings.js";
  import { S } from "./js/strings.js";

  const face = createFace(document.getElementById("face"));
  const moods = document.getElementById("moods");
  for (const m of [...MOODS, "surprised", "sleepy", "angry"]) {
    const b = document.createElement("button");
    b.textContent = m;
    b.setAttribute("aria-pressed", String(m === "normal"));
    b.addEventListener("click", () => {
      face.setMood(m);
      for (const x of moods.children) x.setAttribute("aria-pressed", String(x === b));
    });
    moods.appendChild(b);
  }

  const preview = createPreview(document.getElementById("preview"));
  const $ = (id) => document.getElementById(id);
  S.themeNames.forEach((n, i) => $("theme").add(new Option(`${i} ${n}`, String(i))));
  const pageBoxes = {};
  for (const k of PAGE_KEYS) {
    const l = document.createElement("label");
    const c = document.createElement("input");
    c.type = "checkbox"; c.checked = true; pageBoxes[k] = c;
    l.append(c, " " + k);
    $("pages").appendChild(l);
    $("only").add(new Option(k, k));
  }

  function config() {
    const only = $("only").value;
    const pages = {};
    for (const k of PAGE_KEYS) pages[k] = only ? k === only : pageBoxes[k].checked;
    return {
      mount: document.querySelector("input[name=mount]:checked").value,
      theme: Number($("theme").value),
      github_user: $("gh").value, stock_key: $("sk").value, ticker: $("tk").value,
      tz_name: "Asia/Singapore", tz_rule: "<+08>-8", lat: "1.35", lon: "103.82",
      temp_unit: $("fahr").checked ? "fahrenheit" : "celsius",
      wind_unit: $("mph").checked ? "mph" : "kmh",
      pages,
    };
  }
  const refresh = () => preview.update(config(),
    $("live").checked ? { price: 1734.52, followers: 128, repos: 42 } : {});
  document.querySelector("main").addEventListener("input", refresh);
  document.querySelector("main").addEventListener("change", refresh);
  refresh();
  window.demo = { face, preview, refresh };
</script>
</body>
</html>
