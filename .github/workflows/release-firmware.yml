name: Release firmware

# On every published release (pre-releases too): build the firmware with the
# release's version, check the merged image, build and check the source ZIP
# (job build, read-only token), then attach both to the release and rebuild
# the Pages mirror (job publish, the only job with a write token).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v1.2.0-rc1"
        required: true
      force:
        description: "Replace the files of a final release that already has them"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Version from the tag
        id: ver
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: The release must exist, and a release candidate must be a pre-release
        run: |
          # public API, no token: the build job has none
          if ! JSON=$(curl -fsS "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"); then
            echo "::error::no published release for tag $TAG"; exit 1
          fi
          PRE=$(echo "$JSON" | jq -r '.prerelease')
          if [[ "$TAG" == *-rc* && "$PRE" != "true" ]]; then
            echo "::error::$TAG is a release candidate but the release is not marked pre-release"; exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests
        run: |
          pio test -e native
          python -m unittest discover -s tools -v
      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e esp32-c6
      - name: Check the image and name it
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          B=.pio/build/esp32-c6
          shopt -s nullglob
          BOOT=(~/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin)
          if [ "${#BOOT[@]}" -ne 1 ]; then
            echo "::error::expected one boot_app0.bin, found ${#BOOT[@]}"; exit 1
          fi
          python tools/release_image.py $B/firmware.factory.bin $B/bootloader.bin $B/partitions.bin "${BOOT[0]}" $B/firmware.bin
          grep -aqF "Monitor-Buddy $V starting" $B/firmware.factory.bin || { echo "::error::FW_VERSION $V not in the image"; exit 1; }
          mkdir -p dist
          cp $B/firmware.factory.bin "dist/monitor-buddy-$V.bin"
      - name: Source ZIP, and check it builds
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          git archive --format=zip --prefix=Monitor-Buddy/ -o "dist/Monitor-Buddy-$V.zip" "$TAG" \
            .vscode/extensions.json LICENSE README.md config/config.h.example platformio.ini src/main.cpp lib tools/mb_serial.py
          rm -rf /tmp/zipcheck && mkdir /tmp/zipcheck
          unzip -q "dist/Monitor-Buddy-$V.zip" -d /tmp/zipcheck
          pio run -d /tmp/zipcheck/Monitor-Buddy -e esp32-c6
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/monitor-buddy-*.bin
            dist/Monitor-Buddy-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # upload release assets
      actions: write    # start pages.yml
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Refuse to replace a published final release
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          if [[ "$TAG" != *-rc* ]] && [[ "$FORCE" != "true" ]]; then
            # Fail closed: if the release can't be read, don't risk overwriting it.
            if ! assets="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name')"; then
              echo "::error::couldn't read the assets of $TAG; re-run, or use force"; exit 1
            fi
            if grep -qx "monitor-buddy-${TAG#v}.bin" <<< "$assets"; then
              echo "::error::$TAG is a final release and already has its firmware; re-run with force to replace it"; exit 1
            fi
          fi
      - name: Attach to the release
        run: gh release upload "$TAG" dist/monitor-buddy-*.bin dist/Monitor-Buddy-*.zip --clobber --repo ${{ github.repository }}
      - name: Rebuild the Pages mirror
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}
