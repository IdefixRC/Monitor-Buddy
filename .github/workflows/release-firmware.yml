name: Release firmware

# On every published release (pre-releases too): build the firmware with the
# release's version, check the merged image, build and check the source ZIP,
# attach both to the release, then rebuild the Pages mirror.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v1.2.0-rc1"
        required: true

permissions:
  contents: write   # upload release assets
  actions: write    # start pages.yml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Version from the tag
        id: ver
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests
        run: |
          pio test -e native
          python -m unittest discover -s tools -v
      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e esp32-c6
      - name: Check the image and name it
        run: |
          V=${{ steps.ver.outputs.version }}
          B=.pio/build/esp32-c6
          BOOT_APP0=$(ls ~/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin | head -1)
          python tools/release_image.py $B/firmware.factory.bin $B/bootloader.bin $B/partitions.bin "$BOOT_APP0" $B/firmware.bin
          grep -a -q "Monitor-Buddy $V starting" $B/firmware.factory.bin || { echo "::error::FW_VERSION $V not in the image"; exit 1; }
          cp $B/firmware.factory.bin "monitor-buddy-$V.bin"
      - name: Source ZIP, and check it builds
        run: |
          V=${{ steps.ver.outputs.version }}
          git archive --format=zip --prefix=Monitor-Buddy/ -o "Monitor-Buddy-$V.zip" "$TAG" \
            .vscode/extensions.json LICENSE README.md config/config.h.example platformio.ini src/main.cpp lib tools
          rm -rf /tmp/zipcheck && mkdir /tmp/zipcheck
          unzip -q "Monitor-Buddy-$V.zip" -d /tmp/zipcheck
          pio run -d /tmp/zipcheck/Monitor-Buddy -e esp32-c6
      - name: Attach to the release
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release upload "$TAG" "monitor-buddy-$V.bin" "Monitor-Buddy-$V.zip" --clobber
      - name: Rebuild the Pages mirror
        run: gh workflow run pages.yml --ref main
