; ============================================================
;  Monitor-Buddy — Waveshare ESP32-C6-Touch-LCD-1.47
;  pioarduino (PlatformIO) project configuration
; ------------------------------------------------------------
;  Build:      pio run
;  Flash app:  pio run --target upload
;  Flash FS:   pio run --target uploadfs   (uploads data/  -> LittleFS)
;  Monitor:    pio device monitor
;
;  The captive-portal HTML (index.html / success.html / error.html)
;  MUST be uploaded to LittleFS with `pio run --target uploadfs`
;  or the portal answers HTTP 500. See the header of src/main.cpp.
; ============================================================

[env:esp32-c6]
; pioarduino platform fork — required for ESP32-C6 + Arduino core 3.x.
; The upstream `espressif32` platform does not support the C6.
; `stable` always points at the newest stable pioarduino release;
; swap it for a pinned tag (e.g. .../download/55.03.311/...) to lock the build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

board    = esp32-c6-devkitc-1
framework = arduino

; ── Board / flash ────────────────────────────────────────────
; ESP32-C6-WROOM-1 module on this board: 4 MB flash, no PSRAM.
board_build.flash_mode  = dio
board_upload.flash_size  = 4MB
; Huge-APP layout: ~3 MB app + ~1 MB LittleFS, no OTA (AWM does not use OTA).
; The 1 MB FS partition holds /wifi.json plus the portal HTML.
board_build.partitions  = huge_app.csv
board_build.filesystem  = littlefs

; ── USB CDC serial (native USB-Serial-JTAG on GPIO12/13) ─────
; -I config  puts config/ on the include path so src/main.cpp can
;   #include "config.h" (your local copy) or fall back to
;   "config.h.example". config/config.h is gitignored — see .gitignore.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I config

; ── Serial monitor ──────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct

; ── Auto-deploy the LittleFS image (data/) after `upload` ────
; Runs `uploadfs` automatically, but ONLY when a file in data/ changed
; since the last FS upload — because reflashing the FS partition wipes
; AyresWiFiManager's /wifi.json. See scripts/auto_upload_fs.py.
extra_scripts = post:scripts/auto_upload_fs.py

; ── Libraries used by src/main.cpp ──────────────────────────
;  Arduino_GFX_Library.h  -> moononournation/GFX Library for Arduino
;       (Arduino_HWSPI + Arduino_ST7789 + Arduino_Canvas, ST7789 172x320 panel)
;  ArduinoJson.h          -> bblanchon/ArduinoJson  — v7 REQUIRED
;       (sketch uses JsonDocument; AWM's internal Static/DynamicJsonDocument
;        names still compile on v7 with deprecation warnings only — do NOT
;        downgrade to v6, see the note in src/main.cpp)
;  AyresWiFiManager.h     -> ayresnet/AyresWiFiManager  (captive Wi-Fi portal)
;  LittleFS / WiFi / HTTPClient / WiFiClientSecure / Wire / esp_sntp
;       -> bundled with the ESP32 Arduino core, no entry needed
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    bblanchon/ArduinoJson @ ^7.2.0
    ; Pinned to 2.0.2 — last known-good release. Newer releases (2.3.x) added an
    ; esp_task_wdt_init(120, true) call that does not compile on Arduino core 3.x
    ; (ESP-IDF v5). 2.0.2 predates that and matches the portal HTML in data/.
    ; Fork + upstream PR #9 fixes 2.3.x; move back to it once merged/released.
    https://github.com/ayresnet/AyresWiFiManager.git#2.0.2
